<title>Flashcards and Quest</title>
<style>:root{--bg:#091F2C;--surface:#0E2A3B;--line:rgba(255,255,255,.14);--text:#FFFFFF;--muted:#D9D9D6;--soft:#8DC8E8;--blue:#0078D4;--radius:18px;--fs:1;
--font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;--mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace}
html{font-size:calc(16px * var(--fs));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1100px 560px at 88% -8%,rgba(0,120,212,.26),transparent 60%),radial-gradient(900px 520px at -8% 108%,rgba(134,97,197,.24),transparent 60%),radial-gradient(700px 420px at 50% 120%,rgba(73,197,177,.10),transparent 60%);pointer-events:none;z-index:-1}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
a{color:#8DC8E8}
button{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:#fff;color:#091F2C;padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:12px}
:focus-visible{outline:3px solid #FFB900;outline-offset:2px}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,4vw,40px);background:rgba(9,31,44,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{height:22px;width:auto;flex:none;display:block}
.brand .divider{width:1px;height:22px;background:rgba(255,255,255,.35)}
.app-name{font-weight:600;font-size:.95rem;white-space:nowrap}
.view-switch{margin-left:auto;display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px}
.view-switch button{font-size:.9rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.view-switch button:hover{color:#fff}
.view-switch button[aria-pressed="true"]{background:#fff;color:#091F2C;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.view-switch button[disabled]{opacity:.5;cursor:not-allowed}
.edition-badge{font-size:.85rem;font-weight:600;padding:6px 14px;color:#fff}
.tools{display:flex;gap:6px}
.tool{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:.95rem;font-weight:700;display:grid;place-items:center}
.tool:hover{background:rgba(255,255,255,.14)}
.tool[aria-pressed="true"]{background:#fff;color:#091F2C}
/* banners */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px clamp(14px,4vw,40px);font-size:.9rem;background:#FFE399;color:#091F2C}
.banner.preview{background:#8DC8E8}
.banner b{font-weight:700}
.banner .btn{padding:5px 12px;font-size:.85rem;color:#091F2C;background:#fff;border-color:#091F2C}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,4vw,40px)}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,31,44,.82) 0%,rgba(9,31,44,.45) 60%,rgba(9,31,44,.1) 100%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:#091F2C;background:#8DC8E8;padding:4px 12px;border-radius:999px}
.hero h1{margin:12px 0 6px;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.12}
.hero p{margin:0;color:#E8E6DF;max-width:780px;font-size:1.02rem}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:rgba(9,31,44,.55);border:1px solid rgba(255,255,255,.22);font-size:.84rem;font-weight:600}
.pill .dot{width:8px;height:8px;border-radius:50%}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}
.tab{font-size:.95rem;font-weight:600;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:9px 16px;border-radius:12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 22px rgba(0,120,212,.38)}
.tab[disabled]{opacity:.4;cursor:not-allowed}
.tab .count{font-size:.74rem;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:999px}
/* panels */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,2.6vw,26px)}
.panel+.panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel h2{margin:0;font-size:1.3rem}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.muted{color:var(--muted)}
.empty{text-align:center;padding:34px 16px}
.empty .big{font-size:2.6rem}
.empty h3{margin:8px 0 4px;font-size:1.2rem}
.empty p{color:var(--muted);margin:0 auto 14px;max-width:520px}
/* buttons */
.btn{font-size:.95rem;font-weight:600;border-radius:12px;padding:10px 18px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1.2}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#106EBE}
.btn.hint{background:#FFB900;border-color:#FFB900;color:#091F2C}
.btn.hint:hover{background:#FFC83D}
.btn.danger{border-color:#FFB3BB;color:#FFB3BB}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:#fff;color:#091F2C;border-color:#fff}
.kbd{font-size:.7rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.75;font-weight:600}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-start;margin:4px 0 18px;padding:14px 16px;border-radius:16px;background:rgba(9,31,44,.55);border:1px solid var(--line)}
.fgroup{display:flex;flex-direction:column;gap:7px;min-width:0}
.flabel{font-size:.76rem;font-weight:600;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;font-weight:600;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;max-width:280px}
.chip:hover{background:rgba(255,255,255,.13)}
.chip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:#fff;color:#091F2C;border-color:#fff}
.chip .n{font-size:.72rem;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.chip[aria-pressed="true"] .n{background:rgba(9,31,44,.12)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.d-beginner[aria-pressed="true"]{background:#D4EC8E;border-color:#D4EC8E}
.chip.d-intermediate[aria-pressed="true"]{background:#8DC8E8;border-color:#8DC8E8}
.chip.d-advanced[aria-pressed="true"]{background:#FFA38B;border-color:#FFA38B}
.clear{align-self:flex-end;font-size:.85rem;color:#8DC8E8;background:none;border:0;cursor:pointer;text-decoration:underline;padding:6px 0}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font-size:.88rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
/* difficulty + module tags */
.lvl{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.lvl i{display:block;width:4px;border-radius:1px;background:currentColor;opacity:.28}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:8px}.lvl i:nth-child(3){height:12px}
.lvl.l1 i:nth-child(1),.lvl.l2 i:nth-child(-n+2),.lvl.l3 i{opacity:1}
.diff{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#091F2C;white-space:nowrap}
.diff.beginner{background:#D4EC8E}.diff.intermediate{background:#8DC8E8}.diff.advanced{background:#FFA38B}
.mod-tag{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);max-width:100%}
.mod-tag .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-tag .dot{width:9px;height:9px;border-radius:50%;flex:none}
.light .mod-tag,.back-face .mod-tag{background:rgba(9,31,44,.07);border-color:rgba(9,31,44,.2);color:#091F2C}
.vbadge{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#EAF7E3;color:#07641D;white-space:nowrap}
.vbadge.changed{background:#FFF4CE;color:#7F5A1A}.vbadge.preview{background:#F3EDFB;color:#463668}
/* study */
.meta-line{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);max-width:820px;margin:0 auto 8px;flex-wrap:wrap}
.track{height:6px;border-radius:999px;background:rgba(255,255,255,.1);max-width:820px;margin:0 auto 16px;overflow:hidden}
.track>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0078D4,#49C5B1,#8DE971);transition:width .4s}
.scene{perspective:1600px;max-width:820px;margin:0 auto}
.card{position:relative;height:clamp(300px,46vh,420px);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.75,.25,1);cursor:pointer;border-radius:var(--radius)}
.card:focus-visible{outline:none;box-shadow:0 0 0 3px #FFB900,0 0 0 6px rgba(255,185,0,.35)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:24px 28px 18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.38)}
.front-face{color:#fff;background:linear-gradient(145deg,var(--c1) 0%,var(--c2) 100%);visibility:visible;transition:visibility 0s 0s}
.card.flipped .front-face{visibility:hidden;pointer-events:none;transition-delay:.3s}
.back-face{transform:rotateY(180deg);color:#091F2C;background:linear-gradient(160deg,var(--light) 0%,#FFFFFF 78%);visibility:hidden;pointer-events:none;transition:visibility 0s .3s}
.card.flipped .back-face{visibility:visible;pointer-events:auto;transition-delay:0s}
.front-face::before{content:"";position:absolute;width:360px;height:360px;right:-130px;top:-150px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 68%);opacity:.3;pointer-events:none}
.front-face::after{content:"";position:absolute;width:280px;height:280px;left:-120px;bottom:-160px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);opacity:.24;pointer-events:none}
.face-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:1;overflow:auto;padding:10px 0}
.face-body .q{font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:600;line-height:1.3}
.face-body .a{font-size:clamp(1.1rem,2.2vw,1.4rem);font-weight:600;line-height:1.35}
.face-body .detail{font-size:.98rem;color:#24323d}
.face-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;position:relative;z-index:1;flex-wrap:wrap}
.flip-cue{opacity:.9}
.src-note{color:#3c4a55}
code{font-family:var(--mono);font-size:.92em;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:6px}
.back-face code,.light code,.qcard code,.challenge code,.verdict code{background:rgba(9,31,44,.09)}
.source-bar{max-width:820px;margin:12px auto 0;padding:10px 14px;border-radius:14px;background:rgba(141,200,232,.12);border:1px solid rgba(141,200,232,.38);animation:pop .25s ease}
.source-bar[hidden]{display:none}
.source{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:.88rem}
.src-label{font-weight:600}
.src-link{color:#8DC8E8;font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.src-link:hover{color:#fff}
.src-meta{color:var(--muted);font-size:.78rem;width:100%}
.light .src-link,.qcard .src-link,.verdict .src-link,.challenge .src-link{color:#0B4F8A}
.light .src-meta,.qcard .src-meta,.verdict .src-meta{color:#3c4a55}
.hint-box{max-width:820px;margin:12px auto 0;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#FFE399;color:#091F2C;animation:pop .25s ease}
.hint-box .bulb{font-size:1.2rem}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.rate{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.rate[hidden]{display:none}
.rate .lbl{width:100%;text-align:center;font-size:.85rem;color:var(--muted)}
.r-again{background:#73262F;border-color:#73262F}.r-good{background:#225B62;border-color:#225B62}.r-easy{background:#07641D;border-color:#07641D}
/* practice */
.qcard{background:#fff;color:#091F2C;border-radius:var(--radius);padding:clamp(18px,3vw,28px);max-width:880px;margin:0 auto;box-shadow:0 18px 44px rgba(0,0,0,.3);position:relative;overflow:hidden}
.qcard::before,.challenge::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--c1),var(--glow))}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:#3c4a55}
.qhead .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qtext{font-size:1.28rem;font-weight:600;margin:14px 0 16px;line-height:1.38}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font-size:1rem;color:#091F2C;background:#F4F3F5;border:2px solid #D9D9D6;border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:#0078D4}
.opt .letter{flex:none;width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid #B1B3B3;display:grid;place-items:center;font-weight:700}
.opt[aria-pressed="true"]{border-color:#0078D4;background:#E6F2FB}
.opt[aria-pressed="true"] .letter{background:#0078D4;color:#fff;border-color:#0078D4}
.opt.correct{border-color:#07641D;background:#EAF7E3}.opt.correct .letter{background:#07641D;color:#fff;border-color:#07641D}
.opt.wrong{border-color:#73262F;background:#FCEBED}.opt.wrong .letter{background:#73262F;color:#fff;border-color:#73262F}
.opt[disabled]{cursor:default}
.short-in{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:2px solid #B1B3B3;color:#091F2C;background:#fff}
.short-in:focus{outline:none;border-color:#0078D4;box-shadow:0 0 0 3px rgba(0,120,212,.25)}
.qactions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.qcard .btn,.challenge .btn,.verdict .btn{color:#091F2C;background:#F4F3F5;border-color:#B1B3B3}
.qcard .btn.primary,.verdict .btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}
.qcard .btn.hint,.challenge .btn.hint{background:#FFB900;border-color:#FFB900}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;animation:pop .25s ease}
.feedback.good{background:#EAF7E3;border-left:6px solid #07641D}
.feedback.bad{background:#FCEBED;border-left:6px solid #73262F}
.feedback h3{margin:0 0 6px;font-size:1.05rem}
.feedback p{margin:6px 0}
.selfmark{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selfmark .btn{background:#fff;border:2px solid #0078D4;color:#0B4F8A}
.selfmark .btn[aria-pressed="true"]{background:#07641D;border-color:#07641D;color:#fff}
.ring{width:170px;height:170px}
.ring text{fill:#fff;font-family:var(--font)}
.result-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.review-list{display:grid;gap:10px;margin-top:18px}
.review-item{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.review-item h4{margin:0 0 4px;font-size:1rem}
.review-item p{margin:4px 0;font-size:.92rem}
.review-item .ok{color:#8DE971;font-weight:700}.review-item .no{color:#FFB3BB;font-weight:700}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-size:1.45rem;line-height:1.2}
.tile span{font-size:.82rem;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:12px;align-items:center;font-size:.9rem}
.barrow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0078D4,#49C5B1)}
.barrow .val{text-align:right;font-weight:600}
/* sources */
.src-list{display:grid;gap:10px}
.src-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.src-item .num{width:30px;height:30px;border-radius:9px;background:#0078D4;display:grid;place-items:center;font-weight:700;font-size:.85rem}
/* quest */
.quest-wrap{max-width:1000px;margin:0 auto}
.lobby{position:relative;border-radius:26px;padding:clamp(20px,3.4vw,36px);background:linear-gradient(135deg,#2A446F 0%,#463668 55%,#702573 100%);overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lobby::before{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(255,185,0,.35),transparent 65%);pointer-events:none}
.lobby::after{content:"";position:absolute;width:360px;height:360px;left:-150px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,rgba(73,197,177,.35),transparent 65%);pointer-events:none}
.lobby>*{position:relative;z-index:1}
.lobby h2{font-size:clamp(1.6rem,3.2vw,2.3rem);margin:10px 0 4px;line-height:1.15}
.lobby .tag{color:#E8E6DF;margin:0;max-width:680px}
.floaters{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;font-size:1.8rem;opacity:.22;animation:drift 9s ease-in-out infinite}
.join-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin-top:22px}
@media (max-width:780px){.join-grid{grid-template-columns:1fr}}
.field label,.field .label{display:block;font-weight:600;margin-bottom:6px}
.field input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.45);background:rgba(9,31,44,.6);color:#fff}
.field input[type=text]:focus{outline:none;border-color:#FFB900;box-shadow:0 0 0 3px rgba(255,185,0,.3)}
.field .msg{font-size:.85rem;margin-top:6px;color:#FFE399;min-height:1.3em}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:380px}
.av{font-size:1.55rem;aspect-ratio:1;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.av:hover{transform:translateY(-2px)}
.av[aria-checked="true"]{border-color:#FFB900;background:rgba(255,185,0,.22);transform:scale(1.07)}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;background:rgba(9,31,44,.5);border-radius:12px;padding:10px 12px;font-size:.92rem}
.rules li .ic{font-size:1.1rem;line-height:1.3}
.session{display:inline-flex;gap:10px;align-items:center;margin-top:14px;padding:6px 14px;border-radius:12px;background:rgba(9,31,44,.65);border:1px solid rgba(255,255,255,.25);font-size:.85rem}
.session b{font-family:var(--mono);font-size:1.05rem;letter-spacing:.14em;color:#FFE399}
.btn.go{font-size:1.15rem;padding:14px 30px;background:linear-gradient(90deg,#FFB900,#FF5C39);color:#091F2C;border:0;border-radius:14px;box-shadow:0 10px 26px rgba(255,92,57,.38)}
.btn.go:hover{filter:brightness(1.06);background:linear-gradient(90deg,#FFB900,#FF5C39)}
.lastres{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(9,31,44,.55);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.map{display:flex;gap:10px;overflow-x:auto;padding:26px 4px 8px}
.realm{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);max-width:260px}
.realm.current{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset,0 8px 24px rgba(0,0,0,.25);background:rgba(255,255,255,.09)}
.realm .rname{font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodes{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.28);position:relative}
.node.boss{border-radius:9px}
.node.ok{background:#107C10;border-color:#8DE971}
.node.bad{background:#73262F;border-color:#FFB3BB}
.node.now{background:var(--c1);border-color:#fff;animation:pulse 1.4s infinite}
.node .me{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:1.15rem;animation:bob 1.2s ease-in-out infinite}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(9,31,44,.75);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:8px}
.who{display:flex;gap:8px;align-items:center;font-weight:600}
.who .avbig{font-size:1.6rem}
.stat{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.09);font-size:.85rem;font-weight:600}
.stat.fire{background:linear-gradient(90deg,#FF5C39,#FFB900);color:#091F2C}
.powerups{display:flex;gap:6px;flex-wrap:wrap}
.pu{font-size:.82rem;font-weight:700;border-radius:10px;padding:7px 11px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.pu:hover{background:rgba(255,255,255,.2)}
.pu[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.timer{margin-left:auto;position:relative;width:66px;height:66px;flex:none}
.timer svg{transform:rotate(-90deg);display:block}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.timer.warn .t{color:#FFB900}.timer.danger .t{color:#FFB3BB}.timer.frozen .t{color:#8DC8E8}
.timer.danger{animation:throb .6s infinite}
.challenge{margin-top:14px;background:#fff;color:#091F2C;border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:0 22px 54px rgba(0,0,0,.38);position:relative;overflow:hidden}
.ch-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:#3c4a55}
.boss-tag{background:#091F2C;color:#FFB900;font-weight:700;font-size:.76rem;padding:3px 10px;border-radius:999px}
.ch-q{font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:600;line-height:1.32;margin:12px 0 18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{font-size:1.02rem;font-weight:600;text-align:left;color:#fff;border:0;border-radius:16px;padding:16px;min-height:78px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .1s,opacity .2s}
.ans:hover{transform:translateY(-2px)}
.ans:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.ans .shape{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.05rem}
.ans .k{margin-left:auto;font-size:.72rem;opacity:.8;border:1px solid rgba(255,255,255,.6);border-radius:5px;padding:0 5px}
.ans.a0{background:linear-gradient(135deg,#0078D4,#2A446F)}
.ans.a1{background:linear-gradient(135deg,#8661C5,#463668)}
.ans.a2{background:linear-gradient(135deg,#1F7A6F,#225B62)}
.ans.a3{background:linear-gradient(135deg,#A23AA6,#702573)}
.ans.tf-true{background:linear-gradient(135deg,#107C10,#07641D)}
.ans.tf-false{background:linear-gradient(135deg,#B8461B,#73262F)}
.ans.gone{visibility:hidden}
.ans[disabled]{cursor:default;transform:none}
.ans.dim{opacity:.4}
.ans.right{box-shadow:0 0 0 4px #8DE971,0 6px 0 rgba(0,0,0,.28);opacity:1}
.ans.picked{outline:4px solid #FFB900;outline-offset:3px;opacity:1}
.short-row{display:flex;gap:10px;flex-wrap:wrap}
.short-row .short-in{flex:1;min-width:220px}
.verdict{margin-top:16px;border-radius:16px;padding:14px 16px;animation:pop .25s ease;color:#091F2C}
.verdict.good{background:#EAF7E3;border-left:6px solid #07641D}
.verdict.bad{background:#FCEBED;border-left:6px solid #73262F}
.verdict h3{margin:0 0 6px;font-size:1.12rem}
.verdict p{margin:6px 0}
.verdict .row-btns{margin-top:12px}
.leave{margin-top:14px;text-align:right}
.leave button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
.shake{animation:shake .45s}
.plus{position:absolute;right:24px;top:18px;font-size:1.6rem;font-weight:700;color:#07641D;animation:floatUp 1.1s ease forwards;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(9,31,44,.85);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay .num{font-size:clamp(4rem,14vw,9rem);font-weight:700;animation:zoom .7s ease both;text-shadow:0 10px 40px rgba(0,120,212,.6)}
.finish{text-align:center}
.medal{font-size:4.2rem;line-height:1;animation:bounce 1s ease}
.finish h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:8px 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.badge-earned{display:inline-flex;gap:6px;align-items:center;padding:7px 13px;border-radius:999px;background:linear-gradient(90deg,#FFB900,#FFE399);color:#091F2C;font-weight:700;font-size:.85rem;animation:pop .4s ease both}
.codebox{margin:18px auto;padding:16px;border-radius:18px;background:#fff;color:#091F2C;max-width:780px;text-align:left}
.codebox .lbl{font-weight:700;margin-bottom:8px}
.codebox code{display:block;font-family:var(--mono);font-size:.95rem;word-break:break-all;background:#F4F3F5;padding:10px 12px;border-radius:10px;color:#091F2C;user-select:all;border:1px dashed #B1B3B3}
.codebox .row-btns{margin-top:10px}
.codebox .btn{color:#091F2C;background:#F4F3F5;border-color:#B1B3B3}
.codebox .btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}
.codebox p{margin:8px 0 0;font-size:.88rem;color:#3c4a55}
/* trainer */
.matrix{width:100%;border-collapse:collapse;font-size:.9rem}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.matrix th{font-size:.78rem;color:var(--soft);font-weight:600}
.matrix td.n{text-align:center;font-variant-numeric:tabular-nums}
.matrix th.n{text-align:center}
.warn-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.warn-list li{padding:8px 12px;border-radius:10px;background:rgba(255,227,153,.14);border:1px solid rgba(255,227,153,.4);font-size:.88rem}
.warn-list li.ok{background:rgba(141,233,113,.1);border-color:rgba(141,233,113,.35)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
select,input[type=search],input[type=number],textarea{font:inherit;color:#fff;background:rgba(9,31,44,.6);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 10px}
select option{color:#091F2C;background:#fff}
input[type=number]{width:90px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.85rem;resize:vertical}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.row.off{opacity:.55;border-style:dashed}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.row .ttl{font-weight:600;margin-top:6px}
.row details{margin-top:8px}
.row summary{cursor:pointer;color:var(--soft);font-size:.86rem;font-weight:600}
.det{margin-top:8px;display:grid;gap:6px;font-size:.9rem;padding:10px 12px;border-radius:12px;background:rgba(9,31,44,.55)}
.det .k{color:var(--soft);font-weight:600;margin-right:6px}
.det ol{margin:4px 0 0;padding-left:22px}
.det li.right{color:#8DE971;font-weight:700}
.switch-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted);min-width:64px}
.switch{position:relative;width:50px;height:28px;border-radius:999px;border:2px solid rgba(255,255,255,.45);background:#454142;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:#107C10;border-color:#8DE971}
.switch[aria-checked="true"]::after{left:24px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fbox{padding:14px 16px;border-radius:14px;background:rgba(9,31,44,.5);border:1px solid var(--line)}
.fbox h3{margin:0 0 8px;font-size:1rem}
.fbox label{display:flex;gap:8px;align-items:center;font-size:.92rem;margin:6px 0}
.fbox input[type=text]{width:100%;font:inherit;color:#fff;background:rgba(9,31,44,.6);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 10px}
.bigcode{font-family:var(--mono);font-size:1.6rem;font-weight:700;letter-spacing:.18em;color:#FFE399}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.steps li{padding-left:4px}
.say{display:block;margin-top:4px;padding:8px 12px;border-left:4px solid #FFB900;background:rgba(255,185,0,.1);border-radius:0 10px 10px 0}
.confirm{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(141,200,232,.12);border:1px solid rgba(141,200,232,.38);margin:14px 0;font-size:.95rem}
.confirm input{width:20px;height:20px;margin-top:2px;flex:none}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:12px;max-width:720px;margin:18px auto 22px}
.step{text-align:center;animation:rise .7s ease both}
.step.p3{animation-delay:.1s}.step.p2{animation-delay:.6s}.step.p1{animation-delay:1.1s}
.step .who2{font-weight:700;margin-bottom:6px;word-break:break-word}
.step .avbig{font-size:2.2rem;display:block}
.step .score{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.step .block{border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:2rem;font-weight:700;color:#091F2C}
.step.p1 .block{height:150px;background:linear-gradient(180deg,#FFE399,#FFB900)}
.step.p2 .block{height:112px;background:linear-gradient(180deg,#FFFFFF,#B1B3B3)}
.step.p3 .block{height:84px;background:linear-gradient(180deg,#FFA38B,#BF9474)}
.lb{width:100%;border-collapse:collapse;font-size:.92rem}
.lb th,.lb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.lb th{font-size:.78rem;color:var(--soft);font-weight:600}
.lb td.n{font-variant-numeric:tabular-nums}
.lb tr.top td{background:rgba(255,185,0,.07)}
.ignored{margin-top:12px;font-size:.88rem}
.ignored li{margin:3px 0}
.hard{display:grid;gap:12px}
.hard-item{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.hard-item .pct{font-size:1.6rem;font-weight:700;color:#FFB3BB;text-align:center}
.hard-item .pct span{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.hard-item p{margin:4px 0;font-size:.92rem}
/* toast + fx */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:80;background:#fff;color:#091F2C;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
.foot{max-width:1180px;margin:30px auto 34px;padding:0 clamp(14px,4vw,40px);color:var(--muted);font-size:.8rem;display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:space-between}
.print-only{display:none}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
@keyframes zoom{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* high contrast */
body.hc{--line:#FFFFFF;--muted:#FFFFFF;--soft:#FFFFFF}
body.hc::before{display:none}
body.hc .hero{background:#000}
body.hc .hero::after{background:#000}
body.hc .panel,body.hc .row,body.hc .tab,body.hc .chip,body.hc .hud,body.hc .filters,body.hc .realm,body.hc .tile,body.hc .fbox,body.hc .review-item,body.hc .src-item{background:#000;border-color:#fff}
body.hc .front-face{background:#000;border:3px solid #fff}
body.hc .back-face{background:#fff}
body.hc .lobby{background:#000}
body.hc .ans{background:#000 !important;border:3px solid #fff}
body.hc a{text-decoration:underline}
/* motion */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0s !important;scroll-behavior:auto !important}}
/* small screens */
@media (max-width:640px){.view-switch{margin-left:0;order:3;width:100%;justify-content:center}.tools{margin-left:auto}.barrow{grid-template-columns:1fr 60px}.barrow .bar{grid-column:1/-1;grid-row:2}.hard-item{grid-template-columns:1fr}.podium{gap:6px}}
/* print */
@media print{body{background:#fff;color:#000}body::before{display:none}.topbar,.banner,.wrap,.foot,.toast,.fx,.skip{display:none !important}.print-only{display:block;padding:10px}.pc{break-inside:avoid;border:1px solid #999;border-radius:8px;padding:10px 12px;margin:0 0 10px}.pc h4{margin:0 0 4px}.pc p{margin:3px 0;font-size:12px}}
</style>

,{"id":"c10","module":"m3","difficulty":"advanced","front":"An MCP server used by the coding agent needs an API key. Where do you store it so the MCP configuration can use it?","back":"As an Agents secret whose name starts with `COPILOT_MCP_`, then reference it in `env` or `headers`.","detail":"Only Agents secrets and variables with that prefix are available to the MCP configuration. Secrets also work in a cloud sandbox.","hint":"Only names with one specific prefix are passed through to the MCP configuration.","sourceId":"mcp-repo","label":"verified"}],"quiz":[{"id":"q01","module":"m1","difficulty":"beginner","type":"mc","question":"You describe a goal and Copilot researches the repository, proposes a plan, edits files and runs tools. Which capability category is this?","options":["Assistive","Agentic","Customizations","External AI agents, models and tools"],"answer":1,"hint":"Think about who drives the steps once you've stated the goal.","explanation":"Agentic capabilities work through multiple steps toward a goal, while you stay responsible for reviewing and approving the result.","sourceId":"about","qn":0},{"id":"q02","module":"m1","difficulty":"beginner","type":"tf","question":"Individuals can use Copilot Free to explore core features without a paid plan.","answer":true,"hint":"Look at the access options for individuals.","explanation":"Copilot Free lets individuals explore core features. Paid plans add premium features, more model access and a higher monthly allowance.","sourceId":"about","qn":1},{"id":"q03","module":"m1","difficulty":"intermediate","type":"mc","question":"A developer's enterprise license includes Copilot, but Copilot isn't available to them. What is the most likely reason?","options":["No administrator has assigned them a Copilot seat","They must install the GitHub CLI first","Copilot only works in public repositories","They need to switch to a student account"],"answer":0,"hint":"Licensing alone isn't the final step for organization members." ny name"],"answer":2,"hint":"Only names with one specific prefix reach the MCP configuration.","explanation":"Only Agents secrets and variables whose names start with `COPILOT_MCP_` are available to the MCP configuration; reference them with substitution in `env` or `headers`.","sourceId":"mcp-repo","qn":9}],"settings":{"quest":{"title":"GH-600 morning recap quest","sessionCode":"QXFGM6","count":10,"modules":[],"difficulties":[],"timerMode":"fixed","seconds":{"beginner":30,"intermediate":30,"advanced":45},"fixed":30,"shortBonus":10,"powerUps":true,"ids":["q01","q02","q03","q04","q05","q06","q07","q09","q08","q10"]}}}</script>

try { DECK = JSON.parse(document.getElementById("deck-data").textContent); } catch (e) { DECK = null; }
if (!DECK || !Array.isArray(DECK.flashcards)) { MAIN.textContent = "This deck could not be loaded. Ask your trainer for a fresh copy of the file."; return; }

const COLORS = {
  blue:    { c1: "#0078D4", c2: "#2A446F", light: "#8DC8E8", glow: "#8DC8E8" },
  purple:  { c1: "#8661C5", c2: "#463668", light: "#C5B4E3", glow: "#C5B4E3" },

const ALLOWED_HOSTS = ["learn.microsoft.com", "docs.github.com", "github.blog", "github.com", "microsoftlearning.github.io", "techcommunity.microsoft.com", "azure.microsoft.com", "www.microsoft.com", "resources.github.com", "skills.github.com"];
const DIFFS = [{ id: "beginner", name: "Beginner", lvl: 1 }, { id: "intermediate", name: "Intermediate", lvl: 2 }, { id: "advanced", name: "Advanced", lvl: 3 }];
const DIFF = {}; DIFFS.forEach(d => { DIFF[d.id] = d; });
const AVATARS = ["🦊", "🐼", "🦉", "🐙", "🚀", "🤖", "🐯", "🐧", "🦄", "🐝", "🐬", "🦖"];
const SHAPES = ["▲", "◆", "●", "■"];
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const DAY = 86400000, BOX_DAYS = [0, 1, 3, 7, 14];

/* ---- normalise deck (accepts v1 decks with topics) ---- */
DECK.meta = DECK.meta || {};
DECK.modules = Array.isArray(DECK.modules) ? DECK.modules : (Array.isArray(DECK.topics) ? DECK.topics : []);
DECK.quiz = Array.isArray(DECK.quiz) ? DECK.quiz : [];
DECK.sources = Array.isArray(DECK.sources) ? DECK.sources : [];
[DECK.flashcards, DECK.quiz].forEach(arr => arr.forEach(x => { x.module = x.module || x.topic || "general"; if (!DIFF[x.difficulty]) x.difficulty = "intermediate"; }));
const EDITION = DECK.edition === "learner" ? "learner" : "trainer";
const IS_TRAINER = EDITION === "trainer";
const ID = String(DECK.meta.deckId || "deck").slice(0, 80);
const MODS = {}; DECK.modules.forEach((m, i) => { MODS[m.id] = Object.assign({ idx: i }, m); });
const SRC = {}; DECK.sources.forEach(s => { SRC[s.id] = s; });

/* ---- safe DOM helpers (all text goes through textContent) ---- */
function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined) continue;
    if (k.slice(0, 5) === "aria-") { n.setAttribute(k, String(v)); continue; }
    if (v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") { for (const s in v) n.style.setProperty(s, v[s]); }
    else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  (kids || []).forEach(c => { if (c !== null && c !== undefined && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function rich(text, cls, tag) {
  const n = el(tag || "div", { class: cls || null });
  String(text == null ? "" : text).split("`").forEach((part, i) => { if (part) n.appendChild(i % 2 ? el("code", { text: part }) : document.createTextNode(part)); });
  return n;
}
function plain(t) { return String(t == null ? "" : t).replace(/`/g, ""); }
function safeUrl(u) {
  try {
    const url = new URL(String(u));
    if (url.protocol !== "https:") return null;
    const h = url.hostname.toLowerCase();
    if (ALLOWED_HOSTS.indexOf(h) === -1) return null;
    if (h === "github.com" && !/^\/MicrosoftLearning\//i.test(url.pathname)) return null;
    return url.href;
  } catch (e) { return null; }
}
function fmtDate(d) {
  if (!d) return "";
  const t = new Date(String(d).slice(0, 10) + "T00:00:00");
  return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtTime(ms) { const s = Math.max(0, ms) / 1000; if (s < 60) return s.toFixed(1) + " s"; const m = Math.floor(s / 60), r = Math.round(s - m * 60); return m + ":" + String(r === 60 ? 59 : r).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function shuffle(a, rnd) { const r = rnd || Math.random, b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function seeded(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function utf8(s) { return new TextEncoder().encode(String(s)); }

function randInt(n) { try { const a = new Uint32Array(1); window.crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } }

const liveEl = document.getElementById("live");
function say(msg) { liveEl.textContent = ""; setTimeout(() => { liveEl.textContent = msg; }, 40); }
let toastTimer = null;

const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---- storage (falls back to memory if blocked) ---- */
const store = (function () {
  const mem = new Map();
  try { const s = window.localStorage, k = "mtt-fq:probe"; s.setItem(k, "1"); s.removeItem(k); return s; }
  catch (e) { return { getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => { mem.set(k, String(v)); }, removeItem: k => { mem.delete(k); } }; }
})();
function loadJSON(k) { try { const v = JSON.parse(store.getItem(k)); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } }
function saveJSON(k, v) { try { store.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } }
const LKEY = "mtt-fq:" + ID + ":learner", TKEY = "mtt-fq:" + ID + ":trainer", PKEY = "mtt-fq:prefs";
const L = loadJSON(LKEY);
L.cards = L.cards || {}; L.starred = L.starred || {}; L.practice = L.practice || {}; L.quest = L.quest || {}; L.quest.attempts = L.quest.attempts || {};
L.filters = L.filters || {}; if (!DIFF[L.filters.diff]) L.filters.diff = "all"; if (!MODS[L.filters.mod]) L.filters.mod = "all";
const T = IS_TRAINER ? loadJSON(TKEY) : {};

function saveL() { saveJSON(LKEY, L); }
function saveT() { if (IS_TRAINER) saveJSON(TKEY, T); }

/* ---- lookups ---- */
function modOf(id) { return MODS[id] || { id: id, name: "General", color: "blue", idx: 999 }; }
function modShort(id) { const m = modOf(id); return (m.idx < 999 ? "M" + (m.idx + 1) + " · " : "") + (m.short || m.name); }
function col(id) { return COLORS[modOf(id).color] || COLORS.blue; }
function colVars(id) { const c = col(id); return { "--c1": c.c1, "--c2": c.c2, "--light": c.light, "--glow": c.glow }; }
function inclCards() { return IS_TRAINER ? DECK.flashcards.filter(c => !T.exCards[c.id]) : DECK.flashcards; }

function qnOf(q) { return typeof q.qn === "number" ? q.qn : DECK.quiz.indexOf(q); }
const DECK_HASH = typeof DECK.meta.deckHash === "number" ? (DECK.meta.deckHash & 0xffff) : (fnv32(ID + "|" + DECK.quiz.map(q => q.id).join(",")) & 0xffff);

/* ---- quest settings ---- */
function newSessionCode() { let s = ""; for (let i = 0; i < 6; i++) s += B32[randInt(32)]; return s.replace(/^[0-9]/, "Q"); }
function defaultSettings() {
  const b = (DECK.settings && DECK.settings.quest) || {};

  return {
    title: b.title || ((DECK.meta.courseCode ? DECK.meta.courseCode + " " : "") + "Quest"),

}
const S = IS_TRAINER ? Object.assign(defaultSettings(), T.settings || {}, { ids: null }) : defaultSettings();
function saveS() { if (IS_TRAINER) { T.settings = Object.assign({}, S); delete T.settings.ids; saveT(); } }
if (IS_TRAINER && !T.settings) saveS();

/* ---- small UI atoms ---- */
function lvlIcon(n) { return el("span", { class: "lvl l" + n, "aria-hidden": "true" }, [el("i"), el("i"), el("i")]); }
function diffBadge(d) { const x = DIFF[d] || DIFF.intermediate; return el("span", { class: "diff " + x.id }, [lvlIcon(x.lvl), x.name]); }
function modTag(id) { return el("span", { class: "mod-tag", title: modOf(id).name }, [el("span", { class: "dot", style: { background: col(id).glow } }), el("span", { class: "lbl", text: modShort(id) })]); }
function vBadge(label) {
  const map = { verified: ["", "✓ Verified"], changed: ["changed", "⚠ Recently changed"], preview: ["preview", "Preview feature"] };
  const m = map[label] || map.verified; return el("span", { class: "vbadge " + m[0], text: m[1] });
}
function sourceLine(sourceId) {
  const s = SRC[sourceId], box = el("div", { class: "source" });
  if (!s) { box.appendChild(el("span", { class: "src-meta", text: "Source not available" })); return box; }
  const href = safeUrl(s.url);
  box.appendChild(el("span", { class: "src-label", text: "📖 Source:" }));
  box.appendChild(href ? el("a", { class: "src-link", href: href, target: "_blank", rel: "noopener noreferrer", referrerpolicy: "no-referrer", text: s.title + " ↗" }) : el("span", { text: s.title }));
  const bits = [s.publisher || "Microsoft Learn"];
  if (s.lastUpdated) bits.push("page updated " + fmtDate(s.lastUpdated));
  if (s.verifiedOn || DECK.meta.verifiedOn) bits.push("checked " + fmtDate(s.verifiedOn || DECK.meta.verifiedOn));
  box.appendChild(el("span", { class: "src-meta", text: bits.join(" · ") }));

}
function emptyState(icon, title, text, actions) { return el("div", { class: "empty" }, [el("div", { class: "big", "aria-hidden": "true", text: icon }), el("h3", { text: title }), el("p", { text: text }), actions ? el("div", { class: "row-btns", style: { "justify-content": "center" } }, actions) : null]); }
function twoStep(label, confirmLabel, action, cls) {
  let armed = false, timer = null;
  const b = el("button", { type: "button", class: "btn " + (cls || "danger small"), text: label });
  b.addEventListener("click", () => {
    if (!armed) { armed = true; b.textContent = confirmLabel; timer = setTimeout(() => { armed = false; b.textContent = label; }, 4000); return; }
    clearTimeout(timer); armed = false; b.textContent = label; action();
  });
  return b;
